# Which model and effort build each phase.
# Format: <phase number or full name> <fable|opus|sonnet> [low|medium|high|xhigh|max]
# Phases not listed use DEFAULT_MODEL (sonnet) and DEFAULT_EFFORT (medium).
# fable = Claude Fable 5.1 for the most demanding shader and engine work; opus = Opus 5.5; sonnet = Sonnet 5.5.
# Sonnet lines stay at high or below; available effort levels depend on the model (the skill falls back to high).
01 opus   high     # setup, tokens, copy, art manifest, deploy contract
02 fable  max      # scroll clock, WebGL stage, GLSL library, texture manager (everything depends on it)
03 opus   xhigh    # painting briefs, import pipeline, placeholders, anchors
04 sonnet high     # hero: clouds, glint, pour, ring, print-in
05 sonnet high     # bridge reel, static handover, the three beats
06 fable  max      # the split (the signature cut)
07 sonnet high     # the work: plate scroll-through, print-in, cards
08 opus   xhigh    # parchment push and the procedural sheet
09 opus   xhigh    # soak-in, orbit, window retreat, margin orange
10 fable  xhigh    # the close burn (scorch band, ember, lag) and the coda
11 sonnet high     # match cut, canopy, handwritten title, cards, constellation
12 sonnet high     # moiré print-in, form as stars, the rise
13 sonnet medium   # finale loop, wordmark, footer, menu
14 sonnet high     # phones, reduced motion, accessibility, performance
15 fable  max      # polish every cut against the motion rules
16 opus   max      # automated checks and the final pass
17 opus   xhigh  # motion audit and shared toolkit
18 sonnet high   # motion: hero, bridge and the model
19 opus   xhigh  # motion: the work and the terms
20 sonnet high   # motion: questions, application and finale
21 sonnet   high  # the model: four beats, settled copy, crosshairs
22 sonnet  high  # the model: match cut on the orange and the slice front
23 sonnet  high    # the split: bleed and chunk dots
24 sonnet   high    # motion checks and final pass
